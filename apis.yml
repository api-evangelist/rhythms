aid: rhythms
name: Rhythms
description: >-
  Rhythms is an AI operating partner for teams, built by the team behind Ally.io
  and Microsoft Viva Goals. It automates business reviews, pre-briefs, reports,
  and OKR/goal tracking, surfaces execution risks early, and keeps organizational
  alignment visible across hundreds of connected business tools. Rhythms exposes a
  multi-tenant REST API (api.rhythms.ai) covering documents, teams, users, labels,
  OKR objectives and time periods, data sources, connector and access requests,
  and explorer views, with page-based pagination and a Ransack-based filtering DSL.
  It also supports custom Model Context Protocol (MCP) integrations so agents can
  connect to the platform. Backed by Accel.
